# Local Postgres for the move off the JSON file (rebuild phase 7). Nothing in
# Chronicle reads from it yet; the pages still go through chronicle-store.js.
services:
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: unless-stopped
    # Credentials come from .env (gitignored; see .env.example) so no password
    # is committed. They reuse the standard PG* client variables already in
    # .env, so the container and any client share one copy of the values.
    # The ":?" form makes compose stop with a clear error if .env is missing a
    # value, instead of starting Postgres with an empty one.
    environment:
      POSTGRES_USER: ${PGUSER:?set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
      POSTGRES_DB: ${PGDATABASE:?set PGDATABASE in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
